      "farmasi":{icon:"bi-capsule",sub:"Informasi pelayanan obat dan resep",intro:"Informasi umum pelayanan farmasi. Penggunaan obat harus mengikuti resep dan penjelasan dokter atau apoteker; portal tidak memberi dosis atau menggantikan konsultasi profesional.",cards:[["Pelayanan resep","Resep diverifikasi sesuai prosedur dan ketersediaan obat yang berlaku.","bi-prescription2"],["Informasi obat","Tanyakan cara penggunaan, penyimpanan, dan hal yang perlu diperhatikan langsung kepada apoteker.","bi-chat-square-text"],["Keamanan penggunaan","Jangan berbagi obat, mengganti dosis, atau menghentikan terapi tanpa arahan tenaga kesehatan.","bi-shield-plus"]],flow:[["Serahkan resep","Bawa resep dan dokumen administrasi sesuai ketentuan."],["Verifikasi petugas","Apoteker memeriksa resep dan memberi informasi bila diperlukan."],["Penerimaan obat","Periksa label dan pastikan penjelasan penggunaan dipahami."],["Konsultasi","Tanyakan efek yang perlu diwaspadai dan cara penyimpanan kepada apoteker."]],requirements:["Bawa resep yang sah dan dokumen penjamin bila diperlukan.","Sampaikan alergi atau obat lain yang sedang digunakan kepada tenaga kesehatan.","Jangan menggunakan obat milik orang lain atau mengubah aturan pakai sendiri."],faqs:[["Apakah obat selalu tersedia?","Ketersediaan berubah dan perlu dikonfirmasi kepada instalasi farmasi."],["Bolehkah dosis diubah?","Jangan mengubah dosis tanpa arahan dokter atau apoteker."],["Bagaimana menyimpan obat?","Ikuti label dan tanyakan instruksi penyimpanan spesifik kepada apoteker."]],related:["rawat-jalan","rawat-inap","laboratorium"]},
      "operasi":{icon:"bi-scissors",sub:"Informasi persiapan tindakan bedah",intro:"Tindakan operasi ditetapkan melalui penilaian dokter. Jenis tindakan, kamar operasi, jadwal, dan fasilitas harus dikonfirmasi oleh tenaga kesehatan yang menangani.",cards:[["Konsultasi dan pemeriksaan","Rencana tindakan dibahas bersama dokter dan tim perawatan sesuai kondisi pasien.","bi-person-vcard"],["Persetujuan tindakan","Dokter menjelaskan tindakan, manfaat, risiko, dan alternatif sebelum persetujuan pasien/wakil yang sah.","bi-file-earmark-check"],["Pemulihan pascatindakan","Pemantauan dan rencana pemulihan mengikuti kondisi pasien serta instruksi klinis.","bi-heart-pulse"]],flow:[["Evaluasi dokter","Dokter mengevaluasi kondisi dan indikasi tindakan."],["Persiapan praoperasi","Ikuti pemeriksaan, instruksi makan/minum, dan pengaturan obat yang diberikan tim."],["Persetujuan dan tindakan","Diskusikan pertanyaan; persetujuan tindakan dilakukan sebelum prosedur sesuai ketentuan."],["Pemantauan pemulihan","Ikuti instruksi pemulihan dan jadwal kontrol yang disampaikan tim."]],requirements:["Jangan menghentikan obat atau berpuasa tanpa instruksi dokter.","Sampaikan alergi, obat yang digunakan, dan kondisi penting kepada tim klinis.","Ketentuan pendamping, dokumen, jadwal, dan jenis operasi perlu dikonfirmasi langsung."],faqs:[["Apakah semua jenis operasi tersedia?","Jenis tindakan dan fasilitas yang tersedia belum dipublikasikan; konfirmasikan dengan dokter."],["Siapa memberi instruksi puasa?","Tim yang menangani pasien akan menjelaskan instruksi spesifik. Jangan menentukan sendiri."],["Kapan pasien pulang?","Keputusan pemulangan dibuat tim klinis sesuai kondisi dan prosedur rumah sakit."]],related:["igd","rawat-inap","farmasi"]},
      "persalinan":{icon:"bi-person-hearts",sub:"Informasi kesehatan ibu dan bayi",intro:"Informasi umum perawatan ibu dan bayi. Jenis layanan maternal-neonatal, kapasitas, pendamping, serta fasilitas yang tersedia harus dikonfirmasi kepada rumah sakit.",cards:[["Pemeriksaan kehamilan","Konsultasi dan pemeriksaan mengikuti jadwal serta arahan tenaga kesehatan.","bi-calendar2-heart"],["Persiapan persalinan","Rencana persalinan dan tanda yang perlu diwaspadai dibahas dengan tenaga kesehatan.","bi-bag-heart"],["Perawatan ibu dan bayi","Pemantauan pascapersalinan dan edukasi diberikan sesuai kondisi serta layanan yang tersedia.","bi-person-hearts"]],flow:[["Konsultasi","Diskusikan rencana persalinan dan kondisi kehamilan dengan tenaga kesehatan."],["Konfirmasi layanan","Tanyakan prosedur kedatangan, persyaratan, dan kebijakan pendamping."],["Penilaian klinis","Tenaga kesehatan menilai ibu dan bayi serta menentukan penanganan."],["Perawatan lanjutan","Ikuti edukasi, pemantauan, dan jadwal kontrol yang diberikan."]],requirements:["Siapkan dokumen administrasi dan catatan pemeriksaan yang diminta petugas.","Tanyakan ketentuan pendamping, persiapan ibu, dan barang yang perlu dibawa.","Untuk kondisi darurat, segera cari pertolongan; jangan menunggu pendaftaran online."],faqs:[["Apakah pendamping boleh masuk?","Kebijakan pendamping perlu dikonfirmasi langsung kepada rumah sakit."],["Apakah semua tindakan persalinan tersedia?","Jenis layanan bergantung pada fasilitas dan indikasi klinis; konfirmasikan kepada tenaga kesehatan."],["Apa yang perlu dibawa?","Tanyakan daftar persiapan terbaru kepada petugas karena ketentuannya dapat berbeda."]],related:["igd","rawat-inap","farmasi"]},
      "rehabilitasi-medik":{icon:"bi-universal-access",sub:"Informasi pemulihan fungsi dan aktivitas",intro:"Program rehabilitasi direncanakan tenaga kesehatan sesuai kebutuhan pasien. Jenis terapi, jadwal, dan fasilitas perlu diverifikasi langsung.",cards:[["Penilaian kebutuhan","Tenaga kesehatan menilai tujuan pemulihan dan kebutuhan pasien.","bi-person-check"],["Program terapi","Jenis dan intensitas terapi ditetapkan berdasarkan penilaian profesional.","bi-person-arms-up"],["Evaluasi kemajuan","Rencana dapat dievaluasi dan disesuaikan oleh tim yang menangani.","bi-graph-up-arrow"]],flow:[["Konsultasi / rujukan","Ikuti arahan dokter untuk memulai layanan rehabilitasi."],["Penilaian awal","Petugas menilai fungsi dan menetapkan tujuan yang sesuai."],["Pelaksanaan program","Terapi dijalankan sesuai jadwal dan instruksi profesional."],["Evaluasi","Sampaikan perubahan kondisi dan ikuti rencana lanjutan."]],requirements:["Bawa rujukan dan dokumen administrasi bila diminta.","Gunakan pakaian yang nyaman hanya jika sesuai arahan petugas.","Jangan memulai latihan yang tidak dianjurkan untuk kondisi Anda."],faqs:[["Apakah fisioterapi tersedia?","Jenis layanan rehabilitasi yang tersedia harus dikonfirmasi kepada rumah sakit."],["Seberapa sering harus menjalani terapi?","Frekuensi ditentukan tenaga kesehatan sesuai kebutuhan pasien."],["Apakah perlu rujukan?","Persyaratan bergantung pada jalur layanan dan penjamin; konfirmasikan terlebih dahulu."]],related:["rawat-jalan","rawat-inap","igd"]},
      "ambulans":{icon:"bi-truck-front",sub:"Informasi transportasi pasien",intro:"Informasi umum mengenai transportasi pasien. Ketersediaan armada, cakupan, jadwal, biaya, dan nomor permintaan RSUD belum diverifikasi pada portal.",cards:[["Permintaan layanan","Hubungi kanal resmi rumah sakit untuk memastikan layanan dan ketersediaan armada.","bi-telephone"],["Kesiapan pasien","Petugas menentukan kesiapan transportasi dan kebutuhan pendamping sesuai kondisi pasien.","bi-person-check"],["Rujukan","Pengaturan rujukan dan transportasi mengikuti penilaian serta koordinasi tenaga kesehatan.","bi-arrow-left-right"]],flow:[["Hubungi kanal resmi","Minta informasi ambulans melalui nomor resmi yang diverifikasi."],["Sampaikan kebutuhan","Ikuti pertanyaan petugas; jangan mengirim data medis melalui formulir umum."],["Konfirmasi kesiapan","Petugas mengonfirmasi ketersediaan, lokasi, dan prosedur layanan."],["Koordinasi perjalanan","Ikuti arahan petugas dan tenaga kesehatan selama proses transportasi."]],requirements:["Jangan gunakan portal ini sebagai pengganti panggilan darurat.","Nomor telepon, tarif, cakupan, dan formulir pemesanan belum tersedia sampai disahkan pengelola.","Untuk kondisi mengancam nyawa, hubungi layanan darurat resmi setempat atau segera menuju IGD."],faqs:[["Bagaimana cara meminta ambulans?","Kontak dan prosedur resmi belum dipublikasikan. Hubungi RSUD melalui kanal resmi yang telah diverifikasi."],["Apakah ambulans selalu tersedia?","Ketersediaan armada dan cakupan layanan perlu dikonfirmasi langsung."],["Bisakah meminta ambulans melalui formulir ini?","Belum. Formulir permintaan hanya dapat diaktifkan setelah prosedur disetujui pengelola."]],related:["igd","rawat-inap","persalinan"],ambulance:true}

    function serviceCards(items,klass=""){return `<div class="service-grid-cards ${klass}">${items.map(([title,description,icon])=>`<article class="service-detail-card"><span class="service-icon"><i class="bi ${icon||"bi-check2-circle"}"></i></span><h3>${esc(title)}</h3><p>${esc(description)}</p></article>`).join("")}</div>`}
    function servicePage(path,title){const data=serviceDetails[path];const service=services.find(item=>item.path===path);return `<section class="service-hero ${data.ambulance?"ambulance-visual":""}"><div class="container-wide service-hero-grid"><div><div class="breadcrumbs"><a href="#/">Beranda</a> <i class="bi bi-chevron-right"></i> <a href="#/pelayanan/rawat-jalan">Pelayanan</a> <i class="bi bi-chevron-right"></i> ${esc(title)}</div><span class="eyebrow">${esc(data.sub)}</span><h1>${esc(title)}</h1><p>${esc(data.intro)}</p><div class="actions">${path==="rawat-jalan"?'<a class="btn-main" href="#/pendaftaran"><i class="bi bi-calendar2-check"></i> Daftar Sekarang</a>':path==="igd"?'<a class="btn-main" href="#/kontak"><i class="bi bi-geo-alt"></i> Informasi Kontak Resmi</a>':path==="ambulans"?'<a class="btn-main" href="#/kontak"><i class="bi bi-info-circle"></i> Informasi Kontak Resmi</a>':'<a class="btn-main" href="#/kontak"><i class="bi bi-info-circle"></i> Konfirmasi Informasi</a>'}<a class="btn-soft" href="#/pelayanan">Lihat semua pelayanan</a></div></div><div class="service-visual"><div class="service-orbit"><i class="bi ${data.icon}"></i><span class="mini-orbit"><i class="bi ${path==="igd"?"bi-heart-pulse":path==="ambulans"?"bi-plus-lg":"bi-plus-lg"}"></i></span></div></div></div></section><section class="service-section"><div class="container-wide"><div class="service-warning"><i class="bi bi-patch-exclamation"></i><div><strong>Informasi perlu konfirmasi resmi.</strong> Rincian operasional, ketersediaan layanan, jadwal, persyaratan, dan biaya dapat berubah. Teks panduan umum di bawah bukan pengganti informasi resmi RSUD Talaud.</div></div></div></section><section class="service-section pt-0"><div class="container-wide"><div class="section-heading"><div><span class="eyebrow">Mengenal layanan</span><h2>Informasi utama</h2></div></div>${serviceCards(data.cards)}${data.triage?`<div class="mt-4"><h3 class="h5 fw-bold">Panduan umum prioritas triase</h3><p class="text-secondary small">Triase dilakukan oleh petugas klinis. Pilihan di bawah hanya menjelaskan prinsip umum dan bukan alat diagnosis atau penilaian mandiri.</p><div class="triage-tabs" role="group" aria-label="Kategori prioritas triase"><button type="button" aria-pressed="true" data-triage="segera">Perlu pertolongan segera</button><button type="button" aria-pressed="false" data-triage="urgent">Perlu dinilai petugas</button><button type="button" aria-pressed="false" data-triage="lainnya">Keluhan lainnya</button></div><div class="triage-result" id="triageResult">Jika mengalami kondisi yang mengancam nyawa, segera cari pertolongan darurat. Jangan menunggu pendaftaran online. Petugas IGD menentukan prioritas setelah penilaian langsung.</div></div>`:""}</div></section>${path==="rawat-jalan"?`<section class="soft-band service-section"><div class="container-wide"><div class="section-heading"><div><span class="eyebrow">Data yang dipublikasikan</span><h2>Poliklinik dan dokter</h2></div><a class="arrow-link" href="#/dokter">Lihat direktori dokter <i class="bi bi-arrow-right"></i></a></div><div class="service-search"><input class="form-control" id="serviceDoctorSearch" type="search" placeholder="Cari nama dokter atau spesialisasi…" aria-label="Cari dokter rawat jalan"></div><div class="service-clinic-list" id="serviceClinicList">${API_CONFIGURED?'<div class="data-state">Memuat informasi poliklinik…</div>':apiUnavailable()}</div><div class="service-doctor-list mt-3" id="serviceDoctorList"></div></div></section>`:""}${path==="laboratorium"||path==="radiologi"?`<section class="soft-band service-section"><div class="container-wide"><div class="section-heading"><div><span class="eyebrow">Jenis pemeriksaan</span><h2>Informasi kategori</h2></div><p>Kategori berikut bukan pernyataan bahwa pemeriksaan tersedia di RSUD Talaud.</p></div><input class="form-control service-search" id="examSearch" type="search" placeholder="Cari kategori pemeriksaan…" aria-label="Cari pemeriksaan"><div class="service-grid-cards" id="examCards">${data.searchable.map((item,index)=>`<article class="service-detail-card service-lab-item" data-search="${esc(item.toLowerCase())}"><span class="service-icon"><i class="bi ${path==="radiologi"?"bi-camera":"bi-eyedropper"}"></i></span><h3>${esc(item)}</h3><p>Konfirmasi ketersediaan dan persiapan langsung kepada dokter atau petugas.</p></article>`).join("")}</div></div></section>`:""}<section class="service-section"><div class="container-wide"><div class="section-heading"><div><span class="eyebrow">Alur pelayanan</span><h2>Langkah yang perlu diketahui</h2></div></div><div class="service-step-grid">${data.flow.map(([heading,body])=>`<article class="service-step"><strong>${esc(heading)}</strong><span>${esc(body)}</span></article>`).join("")}</div></div></section><section class="soft-band service-section"><div class="container-wide split"><div><span class="eyebrow">Persiapan kunjungan</span><h2 class="fw-bold mt-2">Persyaratan dan hal penting</h2><ul class="prose">${data.requirements.map(text=>`<li>${esc(text)}</li>`).join("")}</ul></div><div>${path==="rawat-inap"?serviceCards([["Ruang perawatan","Ilustrasi generik. Kelas, kapasitas, tarif, dan fasilitas kamar resmi belum dikonfirmasi.","bi-door-open"],["Kenyamanan pasien","Informasi fasilitas kamar mengikuti data yang disahkan pengelola.","bi-house-heart"],["Privasi dan kunjungan","Jam kunjungan dan aturan pendamping perlu konfirmasi petugas.","bi-people"]]):`<div class="callout"><i class="bi ${data.icon} fs-3"></i><h2 class="mt-3">${path==="igd"?"Darurat tidak menunggu antrean online.":path==="ambulans"?"Gunakan kontak resmi yang terverifikasi.":"Ikuti arahan tenaga kesehatan."}</h2><p>${path==="igd"?"Segera cari pertolongan jika kondisi mengancam nyawa. Petugas menentukan prioritas triase setelah penilaian.":path==="ambulans"?"Nomor ambulans dan formulir pemesanan belum ditampilkan karena belum diverifikasi dan disetujui.":"Informasi khusus pasien dan detail tindakan harus dijelaskan oleh tenaga kesehatan yang menangani."}</p></div>`}</div></div></section><section class="service-section"><div class="container-wide"><div class="section-heading"><div><span class="eyebrow">Pertanyaan umum</span><h2>Yang sering ditanyakan</h2></div></div><div class="service-faq">${data.faqs.map(([question,answer])=>`<details><summary>${esc(question)}</summary><p>${esc(answer)}</p></details>`).join("")}</div></div></section><section class="service-section pt-0"><div class="container-wide"><div class="service-cta"><div><strong class="fs-5">${path==="rawat-jalan"?"Siap mengajukan pendaftaran?":"Perlu informasi lebih lanjut?"}</strong><p>${path==="rawat-jalan"?"Permohonan online perlu konfirmasi petugas.":"Hubungi rumah sakit melalui kanal resmi yang telah diverifikasi."}</p></div><a class="btn-soft" href="${path==="rawat-jalan"?"#/pendaftaran":"#/kontak"}">${path==="rawat-jalan"?"Daftar Online":"Kontak Resmi"} <i class="bi bi-arrow-right"></i></a></div><h2 class="h5 fw-bold mt-5">Pelayanan terkait</h2><div class="service-grid mt-3">${data.related.map(key=>serviceCard(services.find(item=>item.path===key))).join("")}</div></div></section>`}

    function pageHeader(path,title){return `<section class="page-hero"><div class="container-wide"><div class="breadcrumbs"><a href="#/">Beranda</a> <i class="bi bi-chevron-right"></i> ${esc(groups.find(g=>g.items.some(i=>i[1]===path))?.name||"Portal")} <i class="bi bi-chevron-right"></i> ${esc(title)}</div><span class="eyebrow">${esc(groups.find(g=>g.items.some(i=>i[1]===path))?.name||"Informasi")}</span><h1>${esc(title)}</h1><p>${esc(pageDescription(path,title))}</p></div></section>`}
    function pageDescription(path,title){if(services.some(item=>item.path===path))return services.find(item=>item.path===path).description;const map={"profil":"Informasi profil dan identitas RSUD Talaud.","visi-misi":"Arah, nilai, dan tujuan pelayanan rumah sakit.","sejarah":"Informasi sejarah dan perkembangan rumah sakit.","struktur-organisasi":"Informasi organisasi dan tata kelola rumah sakit.","sambutan-direktur":"Sambutan pimpinan rumah sakit.","fasilitas":"Informasi fasilitas yang disediakan rumah sakit.","berita":"Informasi terbaru yang diterbitkan rumah sakit.","galeri":"Dokumentasi kegiatan dan fasilitas rumah sakit.","kontak":"Informasi kontak resmi dan lokasi rumah sakit.","dokter":"Cari daftar dokter berdasarkan spesialisasi dan jadwal yang tersedia.","jadwal-dokter":"Jadwal praktik dokter yang dipublikasikan rumah sakit.","spesialisasi":"Bidang spesialisasi dokter yang tersedia.","poliklinik":"Informasi poliklinik dan layanan rawat jalan.","pendaftaran":"Ajukan pendaftaran rawat jalan secara online.","cek-pendaftaran":"Periksa status permohonan pendaftaran dengan kode registrasi.","cek-antrean":"Periksa informasi antrean menggunakan kode registrasi.","bpjs":"Informasi umum penggunaan BPJS Kesehatan.","pengaduan":"Sampaikan pengaduan, kritik, atau saran kepada rumah sakit.","kritik-saran":"Sampaikan kritik dan saran untuk perbaikan layanan.","lacak-pengaduan":"Periksa tindak lanjut pengaduan menggunakan nomor tiket.","riwayat-pengaduan":"Riwayat pengaduan hanya tersedia bagi pelapor melalui nomor tiket.","tindak-lanjut":"Informasi mengenai proses tindak lanjut pengaduan."};return map[path]||`Informasi ${title.toLowerCase()} RSUD Talaud.`}
    function infoUnavailable(title){return `<div class="data-state"><strong>${esc(title)} belum dipublikasikan</strong>Informasi ini perlu dikonfirmasi dan diisi oleh pengelola RSUD Talaud. Hubungi rumah sakit melalui kanal resmi untuk informasi terkini.</div>`}

n kepesertaan dan persyaratan rujukan Anda sesuai ketentuan BPJS Kesehatan yang berlaku. Validasi kepesertaan tidak tersedia di portal ini.</p><p>Untuk informasi biaya dan penjaminan, konfirmasikan langsung kepada petugas rumah sakit dan BPJS Kesehatan.</p>","jadwal-pelayanan":"<h2>Jadwal pelayanan</h2><p>Jadwal layanan dapat berubah. Silakan konfirmasikan jadwal terkini melalui kanal resmi rumah sakit.</p>","persyaratan":"<h2>Persyaratan kunjungan</h2><ul><li>Siapkan identitas diri dan dokumen administrasi yang relevan.</li><li>Pasien BPJS menyiapkan kartu kepesertaan dan dokumen rujukan jika dipersyaratkan.</li><li>Konfirmasikan persyaratan khusus kepada rumah sakit sebelum berkunjung.</li></ul><p>Daftar ini bersifat umum dan bukan konfirmasi kebijakan rumah sakit.</p>","pembayaran":"<h2>Informasi pembayaran</h2><p>Metode pembayaran dan informasi tarif resmi perlu dikonfirmasi kepada bagian administrasi rumah sakit.</p>","hak-kewajiban":"<h2>Hak pasien</h2><p>Pasien berhak memperoleh informasi yang jelas, privasi, dan perlakuan yang menghormati martabatnya sesuai peraturan yang berlaku.</p><h2>Kewajiban pasien</h2><p>Pasien diharapkan memberikan informasi yang benar kepada tenaga kesehatan, mengikuti tata tertib, dan menghormati hak orang lain.</p>","informasi-pengaduan":"<h2>Pengaduan dan informasi tindak lanjut</h2><p>Pengaduan dapat disampaikan tanpa mencantumkan rincian rekam medis atau informasi kesehatan sensitif pada formulir publik.</p><a class=\"btn-main\" href=\"#/pengaduan\">Buka formulir pengaduan</a>","riwayat-pengaduan":"<h2>Riwayat pengaduan</h2><p>Untuk menjaga kerahasiaan, riwayat tidak ditampilkan dalam daftar publik. Periksa satu tiket menggunakan nomor tiket dan nomor kontak pelapor.</p><a class=\"btn-main\" href=\"#/lacak-pengaduan\">Lacak satu tiket</a>","tindak-lanjut":"<h2>Proses tindak lanjut</h2><p>Pengaduan diteruskan kepada pengelola untuk ditinjau. Status tindak lanjut dapat diperiksa dengan nomor tiket dan nomor kontak pelapor.</p>"};body=`<div class="prose">${content[path]||`<h2>${esc(title)}</h2><p>Informasi ini belum tersedia.</p>`}${["kontak","fasilitas","profil","struktur-organisasi"].includes(path)?infoUnavailable(title):""}</div>`}

    function doctorPage(path){if(!API_CONFIGURED)return apiUnavailable();return `<div class="search-row"><input class="form-control" id="doctorSearch" type="search" placeholder="Cari nama dokter…" aria-label="Cari nama dokter">${path!=="spesialisasi"?'<select class="form-select" id="specialtyFilter" aria-label="Filter spesialisasi"><option value="">Semua spesialisasi</option></select>':""}<button class="btn-soft" id="doctorRefresh" type="button"><i class="bi bi-arrow-clockwise"></i> Muat ulang</button></div><div id="doctorList" class="doctor-grid"><div class="data-state">Memuat informasi dokter yang dipublikasikan…</div></div>`}

    function appointmentPage(){return `<div class="form-card"><form id="appointmentForm" novalidate><div class="notice mb-3"><i class="bi bi-info-circle"></i> Pendaftaran ini merupakan permohonan, bukan konfirmasi jadwal atau pengganti layanan darurat. Jangan masukkan diagnosis atau informasi medis.</div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="patientName">Nama pasien</label><input class="form-control" id="patientName" name="name" maxlength="100" autocomplete="name" required></div><div class="col-md-6"><label class="form-label" for="patientPhone">Nomor telepon aktif</label><input class="form-control" id="patientPhone" name="phone" inputmode="tel" autocomplete="tel" maxlength="20" required></div><div class="col-md-6"><label class="form-label" for="patientType">Jenis pasien</label><select class="form-select" id="patientType" name="patientType" required><option value="">Pilih…</option><option>Pasien baru</option><option>Pasien lama</option></select></div><div class="col-md-6"><label class="form-label" for="clinicSelect">Poliklinik</label><select class="form-select" id="clinicSelect" name="clinic" required><option value="">Pilih poliklinik…</option></select></div><div class="col-md-6"><label class="form-label" for="doctorSelect">Dokter (opsional)</label><select class="form-select" id="doctorSelect" name="doctor"><option value="">Tidak memilih / belum tersedia</option></select></div><div class="col-md-6"><label class="form-label" for="appointmentDate">Tanggal yang diinginkan</label><input class="form-control" id="appointmentDate" name="requestedDate" type="date" required></div><div class="col-12"><label class="form-label" for="terms"><input id="terms" type="checkbox" required> Saya memahami bahwa permohonan perlu dikonfirmasi petugas dan tidak memasukkan data medis sensitif.</label></div><div class="col-12"><button class="btn-main" type="submit"><i class="bi bi-send"></i> Kirim Permohonan</button></div></div><div class="result-box" id="appointmentResult" aria-live="polite"></div></form></div>`}
    function privateLookupPage(kind){const complaint=kind==="complaint";const heading=complaint?"Lacak pengaduan":"Cek status pendaftaran";return `<div class="form-card"><form id="lookupForm" data-kind="${kind}" novalidate><div class="notice mb-3">Hasil pemeriksaan hanya menampilkan status dan tidak menampilkan identitas atau data kesehatan pasien.</div><div class="mb-3"><label class="form-label" for="lookupId">${complaint?"Nomor tiket":"Nomor registrasi"}</label><input class="form-control" id="lookupId" maxlength="50" autocomplete="off" required></div><div class="mb-3"><label class="form-label" for="lookupPhone">Nomor kontak yang digunakan</label><input class="form-control" id="lookupPhone" inputmode="tel" maxlength="20" autocomplete="tel" required></div><button class="btn-main" type="submit"><i class="bi bi-search"></i> Periksa Status</button><div class="result-box" id="lookupResult" aria-live="polite"></div></form></div>`}
    function complaintPage(){return `<div class="form-card"><form id="complaintForm" novalidate><div class="notice mb-3">Jangan tuliskan diagnosis, NIK, nomor rekam medis, dokumen medis, atau data sensitif lainnya. Isi laporan secara ringkas dan sopan.</div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="complainant">Nama (opsional)</label><input class="form-control" id="complainant" maxlength="100"></div><div class="col-md-6"><label class="form-label" for="complaintPhone">Nomor kontak</label><input class="form-control" id="complaintPhone" inputmode="tel" maxlength="20" required></div><div class="col-12"><label class="form-label" for="complaintType">Jenis pesan</label><select class="form-select" id="complaintType"><option>Pengaduan</option><option>Kritik</option><option>Saran</option></select></div><div class="col-12"><label class="form-label" for="complaintMessage">Pesan</label><textarea class="form-control" id="complaintMessage" rows="5" maxlength="1500" required></textarea><div class="form-hint">Maksimal 1.500 karakter.</div></div><div class="col-12"><label class="form-label"><input type="checkbox" id="complaintConsent" required> Saya memahami pesan akan disimpan untuk ditindaklanjuti petugas.</label></div><div class="col-12"><button class="btn-main" type="submit"><i class="bi bi-send"></i> Kirim</button></div></div><div class="result-box" id="complaintResult" aria-live="polite"></div></form></div>`}
    function adminPage(){return `<div class="admin-layout"><aside class="admin-side" id="adminMenu"><button class="active" data-admin="Ringkasan">Ringkasan</button><button data-admin="InformasiPelayanan">Informasi Pelayanan</button><button data-admin="Pendaftaran">Pendaftaran</button><button data-admin="Pengaduan">Pengaduan</button><button data-admin="Dokter">Dokter</button><button data-admin="JadwalDokter">Jadwal Dokter</button><button data-admin="Poliklinik">Poliklinik</button><button data-admin="Berita">Berita</button><button data-admin="Galeri">Galeri</button><button data-admin="LogAktivitas">Log Aktivitas</button></aside><div class="admin-card" id="adminContent"><h2>Area staf rumah sakit</h2><div class="notice">Masuk menggunakan akun organisasi Microsoft 365. Akses ke data dan menu ditentukan oleh peran yang diberikan pengelola Microsoft Entra.</div><button class="btn-main mt-3" id="adminLogin" type="button"><i class="bi bi-microsoft"></i> Masuk dengan Microsoft</button><div id="adminStatus" class="result-box"></div></div></div>`}

    function renderPage(path){const title=path?routeTitles.get(path)||services.find(item=>item.path===path)?.title:"Beranda";if(!path||path===""){$("#app").innerHTML=homePage();loadHomeNews();return}if(serviceDetails[path]){$("#app").innerHTML=servicePage(path,title);mountServiceWidgets(path);loadServiceContent(path);return}if(path==="pelayanan"){$("#app").innerHTML=`${pageHeader(path,"Informasi Pelayanan")}<section class="page-content"><div class="container-wide"><div class="service-grid">${services.map(serviceCard).join("")}</div></div></section>`;return}if(path==="profil-dokter"){$("#app").innerHTML=`${pageHeader(path,"Profil Dokter")}<section class="page-content"><div class="container-wide"><div id="doctorProfile">${API_CONFIGURED?'<div class="data-state">Memuat profil dokter…</div>':apiUnavailable()}</div></div></section>`;loadDoctorProfile();return}if(path==="pendaftaran"){$("#app").innerHTML=`${pageHeader(path,"Pendaftaran Online")}<section class="page-content"><div class="container-wide">${appointmentPage()}</div></section>`;loadAppointmentOptions();return}if(path==="cek-pendaftaran"||path==="cek-antrean"||path==="lacak-pengaduan"||path==="riwayat-pengaduan"){$("#app").innerHTML=`${pageHeader(path,path==="cek-antrean"?"Cek Nomor Antrean":title)}<section class="page-content"><div class="container-wide">${privateLookupPage(path==="lacak-pengaduan"||path==="riwayat-pengaduan"?"complaint":"appointment")}</div></section>`;return}if(path==="pengaduan"||path==="kritik-saran"){$("#app").innerHTML=`${pageHeader(path,path==="kritik-saran"?"Form Kritik dan Saran":title)}<section class="page-content"><div class="container-wide">${complaintPage()}</div></section>`;return}if(path==="admin"){$("#app").innerHTML=`${pageHeader(path,"Administrator")}<section class="page-content"><div class="container-wide">${adminPage()}</div></section>`;return}$("#app").innerHTML=generalPage(path,title||"Informasi");if(["dokter","jadwal-dokter","spesialisasi","poliklinik"].includes(path))loadDoctors(path);if(path==="berita"||path==="galeri")loadPublished(path)}
    async function loadDoctorProfile(){const target=$("#doctorProfile");if(!target||!API_CONFIGURED)return;const name=new URLSearchParams(location.hash.split("?")[1]||"").get("name")||"";if(!name){target.innerHTML=infoUnavailable("Profil dokter");return}try{const result=await apiGet("getDoctorList");const doctor=(result.data||[]).find(item=>item.name===name);if(!doctor){target.innerHTML=infoUnavailable("Profil dokter");return}target.innerHTML=`<article class="doctor-card"><div class="doctor-avatar"><i class="bi bi-person-badge"></i></div><h2 class="h4 fw-bold">${esc(doctor.name)}</h2><p><i class="bi bi-award"></i> ${esc(doctor.specialty||"Spesialisasi belum dicantumkan")}</p><p><i class="bi bi-hospital"></i> ${esc(doctor.clinic||"Poliklinik belum dicantumkan")}</p><a class="arrow-link" href="#/jadwal-dokter">Lihat jadwal praktik <i class="bi bi-arrow-right"></i></a><a class="btn-main mt-3" href="#/pendaftaran">Ajukan pendaftaran <i class="bi bi-arrow-right"></i></a></article>`}catch(error){target.innerHTML=`<div class="data-state"><strong>Profil dokter belum dapat dimuat</strong>${esc(error.message)}</div>`}}
    function mountServiceWidgets(path){const details=serviceDetails[path];$(".service-hero").classList.add(`service-${path}`,"route-in");if("IntersectionObserver"in window&&!matchMedia("(prefers-reduced-motion: reduce)").matches){const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("is-visible");observer.unobserve(entry.target)}}),{threshold:.12});$("#app").querySelectorAll(".service-detail-card,.service-step,.service-faq details").forEach(element=>{element.classList.add("service-reveal");observer.observe(element)})}if(details.triage&&!$("#app").dataset.triageBound){$("#app").dataset.triageBound="true";$("#app").addEventListener("click",event=>{const button=event.target.closest("[data-triage]");if(!button)return;$("#app").querySelectorAll("[data-triage]").forEach(item=>item.setAttribute("aria-pressed",String(item===button)));const messages={segera:"Jika kondisi mengancam nyawa, cari pertolongan darurat segera. Jangan menunggu pendaftaran online. Petugas IGD menetapkan prioritas setelah penilaian langsung.",urgent:"Segera sampaikan kondisi kepada petugas saat tiba. Penilaian prioritas dilakukan oleh petugas klinis, bukan melalui pemilihan kategori ini.",lainnya:"Sampaikan keluhan kepada petugas untuk dinilai. Portal ini tidak dapat menentukan tingkat kegawatan atau menggantikan pemeriksaan."};$("#triageResult").textContent=messages[button.dataset.triage]})}if(details.searchable)$("#examSearch").addEventListener("input",event=>{const query=event.target.value.trim().toLowerCase();$("#examCards").querySelectorAll(".service-lab-item").forEach(card=>card.hidden=!card.dataset.search.includes(query))});if(path==="rawat-jalan")loadServiceDoctors()}
    async function loadServiceContent(path){if(!API_CONFIGURED)return;try{const result=await apiGet("getData",{sheet:"InformasiPelayanan",public:"1"});const record=(result.data||[]).find(item=>item.slug===path);if(!record)return;const slot=document.createElement("section");slot.className="service-section";slot.id="serviceCmsInfo";slot.innerHTML=`<div class="container-wide"><div class="service-warning"><i class="bi bi-patch-check"></i><div><strong>Informasi terverifikasi pengelola.</strong> Data ini berasal dari konten publik yang dikelola administrator.</div></div><div class="prose mt-4"><h2>${esc(record.nama_pelayanan||routeTitles.get(path))}</h2><p>${esc(record.deskripsi||"")}</p>${serviceCmsText("Informasi layanan",record.konten)}${serviceCmsText("Persyaratan",record.persyaratan)}${serviceCmsText("Prosedur",record.prosedur)}${serviceCmsText("Jadwal",record.jadwal)}</div></div>`;$(".service-warning")?.parentElement?.insertAdjacentElement("afterend",slot)}catch(error){showToast(`Konten layanan resmi belum dapat dimuat: ${error.message}`,"error")}}
    function serviceCmsText(title,value){if(!value)return"";return `<h3>${esc(title)}</h3>${String(value).split(/\r?\n/).filter(Boolean).map(line=>`<p>${esc(line)}</p>`).join("")}`}
    async function loadServiceDoctors(){const clinics=$("#serviceClinicList"),doctors=$("#serviceDoctorList");if(!clinics||!doctors)return;if(!API_CONFIGURED){clinics.innerHTML=apiUnavailable();return}try{const [clinicData,doctorData,scheduleData]=await Promise.all([apiGet("getData",{sheet:"Poliklinik",public:"1"}),apiGet("getDoctorList"),apiGet("getDoctorSchedule")]);const clinicRows=clinicData.data||[];const doctorRows=doctorData.data||[];const scheduleRows=scheduleData.data||[];clinics.innerHTML=clinicRows.length?clinicRows.map(row=>`<article class="service-detail-card"><span class="service-icon"><i class="bi bi-hospital"></i></span><h3>${esc(row.name||"Poliklinik")}</h3><p>${esc(row.description||"Informasi layanan poliklinik.")}</p><a class="arrow-link" href="#/pelayanan/rawat-jalan">Informasi rawat jalan <i class="bi bi-arrow-right"></i></a></article>`).join(""):infoUnavailable("Poliklinik");const draw=()=>{const query=$("#serviceDoctorSearch").value.trim().toLowerCase();const found=doctorRows.filter(row=>`${row.name||""} ${row.specialty||""} ${row.clinic||""}`.toLowerCase().includes(query));doctors.innerHTML=found.length?found.map(row=>{const schedules=scheduleRows.filter(item=>item.doctorName===row.name);return `<article class="doctor-card"><div class="doctor-avatar"><i class="bi bi-person-badge"></i></div><h3>${esc(row.name||"Dokter")}</h3><p>${esc(row.specialty||"Spesialisasi belum dicantumkan")}</p><p>${esc(row.clinic||"Poliklinik belum dicantumkan")}</p>${schedules.map(item=>`<p><i class="bi bi-clock"></i> ${esc(item.day||"")} ${esc(item.startTime||"")}${item.endTime?`–${esc(item.endTime)}`:""}</p>`).join("")||'<p class="form-hint">Jadwal belum dipublikasikan.</p>'}<a class="arrow-link" href="#/profil-dokter?name=${encodeURIComponent(row.name||"")}">Detail dokter <i class="bi bi-arrow-right"></i></a></article>`}).join(""):infoUnavailable("Dokter")};$("#serviceDoctorSearch").addEventListener("input",draw);draw()}catch(error){clinics.innerHTML=`<div class="data-state"><strong>Informasi belum dapat dimuat</strong>${esc(error.message)}</div>`}}
    function route(){let path=decodeURIComponent(location.hash.replace(/^#\/?/,"").split("?")[0]).replace(/\/$/,"");if(path.startsWith("pelayanan/"))path=path.slice("pelayanan/".length);if(path&&!routeTitles.has(path)&&!serviceDetails[path])path="";document.title=`${path?routeTitles.get(path)||services.find(item=>item.path===path)?.title||"Informasi Pelayanan":"Beranda"} | Sistem Informasi RSUD Talaud`;renderPage(path);$("#mobileNav").classList.remove("open");$("#mobileToggle").setAttribute("aria-expanded","false");window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"})}

    async function loadHomeNews(){const container=$("#homeNews");if(!container)return;if(!API_CONFIGURED)return;try{const result=await apiGet("getData",{sheet:"Berita",public:"1"});const rows=(result.data||[]).slice(0,3);container.innerHTML=rows.length?`<div class="news-grid">${rows.map(row=>`<article class="news-card p-4"><span class="eyebrow">${esc(row.date||"Informasi")}</span><h3 class="fs-5 fw-bold mt-3">${esc(row.title||"")}</h3><p class="text-secondary small">${esc(row.summary||"")}</p></article>`).join("")}</div>`:infoUnavailable("Berita") }catch(error){container.innerHTML=`<div class="data-state"><strong>Berita belum dapat dimuat</strong>${esc(error.message)}</div>`}}
    async function loadPublished(path){const target=$("#publishedContent");if(!target||!API_CONFIGURED)return;try{const result=await apiGet("getData",{sheet:path==="berita"?"Berita":"Galeri",public:"1"});const rows=result.data||[];if(!rows.length){target.innerHTML=infoUnavailable(path==="berita"?"Berita":"Galeri");return}target.innerHTML=`<div class="${path==="berita"?"news-grid":"info-grid"}">${rows.map(row=>path==="berita"?`<article class="news-card p-4"><span class="eyebrow">${esc(row.date||"Informasi")}</span><h3 class="fs-5 fw-bold mt-3">${esc(row.title||"")}</h3><p class="text-secondary small">${esc(row.summary||"")}</p></article>`:`<article class="info-card"><h3>${esc(row.title||"Dokumentasi")}</h3>${row.imageUrl?`<img class="img-fluid rounded-3 mb-3" src="${esc(row.imageUrl)}" alt="${esc(row.title||"Galeri RSUD")}" loading="lazy">`:""}<p>${esc(row.caption||"")}</p></article>`).join("")}</div>`}catch(error){target.innerHTML=`<div class="data-state"><strong>Informasi belum dapat dimuat</strong>${esc(error.message)}</div>`}}
    async function loadDoctors(path){const container=$("#doctorList");if(!container)return;try{const result=await apiGet(path==="jadwal-dokter"?"getDoctorSchedule":"getDoctorList");doctorsCache=result.data||[];const specialties=[...new Set(doctorsCache.map(item=>item.specialty).filter(Boolean))].sort();const filter=$("#specialtyFilter");if(filter)filter.innerHTML='<option value="">Semua spesialisasi</option>'+specialties.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join("");const render=()=>{const query=($("#doctorSearch")?.value||"").toLowerCase();const spec=filter?.value||"";const rows=doctorsCache.filter(item=>(!query||`${item.name||""} ${item.specialty||""} ${item.clinic||""}`.toLowerCase().includes(query))&&(!spec||item.specialty===spec));container.innerHTML=rows.length?rows.map(item=>`<article class="doctor-card"><div class="doctor-avatar"><i class="bi bi-person-badge"></i></div><h3>${esc(item.name||"Dokter")}</h3><p><i class="bi bi-award"></i> ${esc(item.specialty||"Spesialisasi belum dicantumkan")}</p><p><i class="bi bi-hospital"></i> ${esc(item.clinic||"Poliklinik belum dicantumkan")}</p>${item.day||item.startTime?`<p><i class="bi bi-clock"></i> ${esc(item.day||"")} ${esc(item.startTime||"")}${item.endTime?`–${esc(item.endTime)}`:""}</p>`:""}</article>`).join(""):infoUnavailable("Dokter atau jadwal")};$("#doctorSearch")?.addEventListener("input",render);filter?.addEventListener("change",render);$("#doctorRefresh")?.addEventListener("click",()=>loadDoctors(path));render()}catch(error){container.innerHTML=`<div class="data-state"><strong>Informasi dokter belum dapat dimuat</strong>${esc(error.message)}</div>`}}
    async function loadAppointmentOptions(){if(!API_CONFIGURED){$("#appointmentForm").insertAdjacentHTML("afterbegin",apiUnavailable());return}try{const [clinics,doctors]=await Promise.all([apiGet("getData",{sheet:"Poliklinik",public:"1"}),apiGet("getDoctorList")]);const clinicSelect=$("#clinicSelect");const doctorSelect=$("#doctorSelect");(clinics.data||[]).forEach(item=>{const option=document.createElement("option");option.value=item.name||"";option.textContent=item.name||"";clinicSelect.append(option)});(doctors.data||[]).forEach(item=>{const option=document.createElement("option");option.value=item.name||"";option.textContent=`${item.name||"Dokter"}${item.specialty?` — ${item.specialty}`:""}`;doctorSelect.append(option)});if(!clinics.data?.length)clinicSelect.insertAdjacentHTML("beforeend",'<option disabled>Informasi poliklinik belum tersedia</option>')}catch(error){$("#appointmentForm").insertAdjacentHTML("afterbegin",`<div class="notice error mb-3">${esc(error.message)}</div>`)}}
    function setFormResult(element,message,type=""){element.innerHTML=`<div class="notice ${type}">${esc(message)}</div>`}
    function bindForms(){
      $("#appointmentForm")?.addEventListener("submit",async event=>{event.preventDefault();const form=event.currentTarget;if(!form.reportValidity())return;const result=$("#appointmentResult");const submit=$('button[type="submit"]',form);submit.disabled=true;submit.textContent="Mengirim…";try{const payload=Object.fromEntries(new FormData(form));const response=await apiPost("createAppointment",payload);setFormResult(result,`Permohonan diterima. Simpan nomor registrasi: ${response.registrationId}. Gunakan nomor tersebut dan nomor kontak untuk memeriksa status.`,"success");form.reset()}catch(error){setFormResult(result,error.message,"error")}finally{submit.disabled=false;submit.innerHTML='<i class="bi bi-send"></i> Kirim Permohonan'}});
      $("#lookupForm")?.addEventListener("submit",async event=>{event.preventDefault();if(!event.currentTarget.reportValidity())return;const kind=event.currentTarget.dataset.kind;const target=$("#lookupResult");target.innerHTML='<div class="notice">Memeriksa status…</div>';try{const result=await apiPost(kind==="complaint"?"getComplaintStatus":"checkAppointment",{id:$("#lookupId").value.trim(),phone:$("#lookupPhone").value.trim()});setFormResult(target,`Status: ${result.status||"Belum tersedia"}. ${result.message||""}`,"success")}catch(error){setFormResult(target,error.message,"error")}});
      $("#complaintForm")?.addEventListener("submit",async event=>{event.preventDefault();const form=event.currentTarget;if(!form.reportValidity())return;const target=$("#complaintResult");try{const response=await apiPost("submitComplaint",{name:$("#complainant").value.trim(),phone:$("#complaintPhone").value.trim(),type:$("#complaintType").value,message:$("#complaintMessage").value.trim()});setFormResult(target,`Pesan diterima. Simpan nomor tiket: ${response.ticketId}. Gunakan nomor tiket dan nomor kontak untuk memeriksa status.`,"success");form.reset()}catch(error){setFormResult(target,error.message,"error")}});
      $("#adminLogin")?.addEventListener("click",async()=>{const status=$("#adminStatus");status.innerHTML='<div class="notice">Menghubungkan ke Microsoft Entra ID…</div>';try{if(!API_CONFIGURED)throw new Error("Azure Functions belum dikonfigurasi.");if(!ENTRA_CONFIGURED||!entraClient)throw new Error("Konfigurasi aplikasi Microsoft Entra belum dilengkapi.");await entraReady;const login=await entraClient.loginPopup({scopes:["openid","profile",`api://${ENTRA_API_CLIENT_ID}/access_as_user`]});entraAccount=login.account;signedInUser=await apiGet("loginAdmin");activeAdmin=true;applyRoleMenu(signedInUser.roles||[]);status.innerHTML=`<div class="notice success">Masuk sebagai ${esc(signedInUser.name||signedInUser.email)} · Peran: ${esc((signedInUser.roles||[]).join(", ")||"pengguna")}</div><button class="btn-soft mt-2" id="signOut" type="button">Keluar</button>`;$("#signOut").addEventListener("click",async()=>{activeAdmin=false;signedInUser=null;entraAccount=null;await entraClient.logoutPopup({account:login.account,postLogoutRedirectUri:`${location.origin}${location.pathname}`});location.hash="#/admin"});await loadAdminSection(adminSection)}catch(error){status.innerHTML=`<div class="notice error">${esc(error.message)}</div>`}});
      $("#adminMenu")?.addEventListener("click",event=>{const button=event.target.closest("[data-admin]");if(!button)return;if(button.hidden)return;adminSection=button.dataset.admin;$("#adminMenu .active")?.classList.remove("active");button.classList.add("active");if(activeAdmin)loadAdminSection(adminSection)});
      const adminContent=$("#adminContent");if(adminContent&&!adminContent.dataset.bound){adminContent.dataset.bound="true";adminContent.addEventListener("click",handleAdminClick);adminContent.addEventListener("submit",handleAdminSubmit)}
    }
    function applyRoleMenu(roles){const adminSections=["Ringkasan","InformasiPelayanan","Pendaftaran","Pengaduan","Dokter","JadwalDokter","Poliklinik","Berita","Galeri","LogAktivitas"];const staffSections=["Ringkasan","Pendaftaran","Pengaduan","Dokter","JadwalDokter","Poliklinik"];const contentSections=["Ringkasan","InformasiPelayanan","Dokter","JadwalDokter","Poliklinik","Berita","Galeri"];const allowed=roles.includes("Admin")?adminSections:roles.includes("Staff")?staffSections:roles.includes("ContentEditor")?contentSections:roles.includes("Doctor")?["Ringkasan","JadwalDokter"]:[];$("#adminMenu").querySelectorAll("[data-admin]").forEach(button=>button.hidden=!allowed.includes(button.dataset.admin));const first=$("#adminMenu [data-admin]:not([hidden])");if(first){$("#adminMenu .active")?.classList.remove("active");first.classList.add("active");adminSection=first.dataset.admin}}
    async function loadAdminSection(name){const content=$("#adminContent");if(!content)return;if(!activeAdmin){content.innerHTML='<h2>Area staf rumah sakit</h2><div class="notice">Masuk menggunakan akun Microsoft organisasi untuk mengakses fitur sesuai peran.</div><button class="btn-main mt-3" id="adminLogin" type="button"><i class="bi bi-microsoft"></i> Masuk dengan Microsoft</button><div id="adminStatus" class="result-box"></div>';bindForms();return}content.innerHTML=`<h2>${esc(name)}</h2><p class="text-secondary small">Data dimuat dari Microsoft Lists pada situs organisasi.</p>${name==="Ringkasan"?'<div id="adminTable"><div class="data-state">Memuat ringkasan…</div></div>':`<div id="adminTable"><div class="data-state">Memuat…</div></div>${["Dokter","JadwalDokter","Poliklinik","Berita","Galeri","InformasiPelayanan"].includes(name)?adminForm(name):""}`}`;try{if(name==="Ringkasan"){const result=await apiGet("getDashboardStatistics");const values=result.data||{};$("#adminTable").innerHTML=`<div class="stat-grid">${[["Pendaftaran",values.Pendaftaran,"bi-calendar2-check"],["Pengaduan",values.Pengaduan,"bi-chat-square-text"],["Dokter",values.Dokter,"bi-person-badge"]].map(([label,count,icon])=>`<article class="stat-card"><span class="stat-icon"><i class="bi ${icon}"></i></span><div><strong>${esc(count??0)}</strong><small>${esc(label)} tersimpan</small></div></article>`).join("")}</div>`;return}const result=await apiGet("getData",{sheet:name});adminHeaders=result.headers||[];adminRows=result.data||[];renderAdminTable()}catch(error){$("#adminTable").innerHTML=`<div class="notice error">${esc(error.message)}</div>`}}
    function adminForm(name){if(name==="InformasiPelayanan"){const fields=[["nama_pelayanan","Nama pelayanan","input"],["slug","Slug layanan (mis. rawat-jalan)","input"],["deskripsi","Deskripsi","textarea"],["konten","Konten informasi","textarea"],["persyaratan","Persyaratan","textarea"],["prosedur","Prosedur","textarea"],["jadwal","Jadwal (jika telah diverifikasi)","textarea"],["status","Status publikasi","select"]];return `<details class="mt-4"><summary class="fw-bold">Tambah / kelola konten Informasi Pelayanan</summary><p class="form-hint mt-2">Hanya isi dengan informasi resmi yang sudah disahkan. Konten berstatus aktif akan ditampilkan pada halaman pelayanan.</p><form id="adminCreateForm" class="row g-2 mt-2" data-sheet="${name}">${fields.map(([field,label,type])=>`<div class="col-md-6"><label class="form-label" for="admin-${field}">${esc(label)}</label>${type==="textarea"?`<textarea class="form-control" id="admin-${field}" name="${field}" rows="3" maxlength="${field==="deskripsi"?"300":"12000"}" ${field==="nama_pelayanan"||field==="slug"?"required":""}></textarea>`:type==="select"?`<select class="form-select" id="admin-${field}" name="${field}"><option value="nonaktif">Nonaktif</option><option value="aktif">Aktif (publikasikan)</option></select>`:`<input class="form-control" id="admin-${field}" name="${field}" maxlength="300" ${field==="nama_pelayanan"||field==="slug"?"required":""}>`}</div>`).join("")}<div class="col-12"><button class="btn-main mt-2" type="submit">Simpan informasi</button></div></form></details>`}const specs={Dokter:[["name","Nama dokter"],["specialty","Spesialisasi"],["clinic","Poliklinik"],["phone","Kontak publik (opsional)"]],JadwalDokter:[["doctorId","ID dokter"],["doctorName","Nama dokter"],["clinic","Poliklinik"],["day","Hari"],["startTime","Jam mulai"],["endTime","Jam selesai"]],Poliklinik:[["name","Nama poliklinik"],["description","Deskripsi"]],Berita:[["title","Judul"],["date","Tanggal"],["summary","Ringkasan"],["published","Publikasi: true / false"]],Galeri:[["title","Judul"],["imageUrl","URL gambar HTTPS"],["caption","Keterangan"],["published","Publikasi: true / false"]]};return `<details class="mt-4"><summary class="fw-bold">Tambah data ${esc(name)}</summary><form id="adminCreateForm" class="row g-2 mt-2" data-sheet="${esc(name)}">${(specs[name]||[]).map(([field,label])=>`<div class="col-md-6"><label class="form-label" for="admin-${field}">${esc(label)}</label><input class="form-control" id="admin-${field}" name="${field}" maxlength="500" ${field==="imageUrl"?"type=\"url\" pattern=\"https://.*\"":""} required></div>`).join("")}<div class="col-12"><button class="btn-main mt-2" type="submit">Simpan data</button></div></form></details>`}
    function renderAdminTable(){const target=$("#adminTable");if(!target)return;if(!adminRows.length){target.innerHTML='<div class="data-state"><strong>Belum ada data</strong>Data untuk kategori ini belum tersedia.</div>';return}const statusChoices=adminSection==="Pendaftaran"?["Menunggu verifikasi","Dikonfirmasi","Dijadwalkan","Selesai","Dibatalkan"]:["Diterima","Ditinjau","Ditindaklanjuti","Selesai"];target.innerHTML=`<div class="table-wrap"><table class="table table-hover"><thead><tr>${[...adminHeaders.map(header=>`<th>${esc(header)}</th>`),"<th>Aksi</th>"].join("")}</tr></thead><tbody>${adminRows.map(row=>`<tr>${adminHeaders.map(header=>`<td>${esc(row[header]||"")}</td>`).join("")}<td>${row.id?`${["Pendaftaran","Pengaduan"].includes(adminSection)?`<select class="form-select form-select-sm mb-1" data-status-id="${esc(row.id)}" aria-label="Ubah status">${statusChoices.map(status=>`<option ${row.status===status?"selected":""}>${status}</option>`).join("")}</select><button class="btn btn-sm btn-outline-primary mb-1" data-save-status="${esc(row.id)}">Simpan status</button>`:""}${["Dokter","JadwalDokter","Poliklinik","Berita","Galeri","InformasiPelayanan"].includes(adminSection)?`<button class="btn btn-sm btn-outline-secondary mb-1" data-edit-id="${esc(row.id)}">Edit</button><button class="btn btn-sm btn-outline-danger" data-delete-id="${esc(row.id)}">Hapus</button>`:""}`:""}</td></tr>`).join("")}</tbody></table></div>`}
    async function handleAdminClick(event){const statusButton=event.target.closest("[data-save-status]");if(statusButton){const id=statusButton.dataset.saveStatus;const status=$(`[data-status-id="${CSS.escape(id)}"]`);try{await apiPost("updateData",{sheet:adminSection,id,data:{status:status.value}});showToast("Status berhasil diperbarui.");await loadAdminSection(adminSection)}catch(error){showToast(error.message,"error")}return}const editButton=event.target.closest("[data-edit-id]");if(editButton){const row=adminRows.find(item=>item.id===editButton.dataset.editId);if(!row)return;const data={};for(const header of adminHeaders){if(["id","createdAt","created_at","updated_at"].includes(header))continue;const value=window.prompt(`Ubah ${header}:`,row[header]||"");if(value===null)return;data[header]=value}try{await apiPost("updateData",{sheet:adminSection,id:row.id,data});showToast("Data berhasil diperbarui.");await loadAdminSection(adminSection)}catch(error){showToast(error.message,"error")}return}const button=event.target.closest("[data-delete-id]");if(!button)return;if(!window.confirm("Hapus data ini? Tindakan ini tidak dapat dibatalkan."))return;try{await apiPost("deleteData",{sheet:adminSection,id:button.dataset.deleteId});showToast("Data berhasil dihapus.");await loadAdminSection(adminSection)}catch(error){showToast(error.message,"error")}}
    async function handleAdminSubmit(event){if(event.target.id!=="adminCreateForm")return;event.preventDefault();if(!event.target.reportValidity())return;try{const data=Object.fromEntries(new FormData(event.target));delete data.sheet;await apiPost("insertData",{sheet:event.target.dataset.sheet,data});showToast("Data berhasil disimpan.");await loadAdminSection(adminSection)}catch(error){showToast(error.message,"error")}}

    $("#mobileToggle").addEventListener("click",()=>{const drawer=$("#mobileNav");const open=drawer.classList.toggle("open");$("#mobileToggle").setAttribute("aria-expanded",String(open));$("#mobileToggle").innerHTML=`<i class="bi bi-${open?"x-lg":"list"}"></i>`});
    $("#desktopNav").addEventListener("click",event=>{const button=event.target.closest(".nav-group>button");if(button){const group=button.parentElement;document.querySelectorAll(".nav-group.open").forEach(el=>{if(el!==group)el.classList.remove("open")});group.classList.toggle("open");return}if(event.target.closest("a"))document.querySelectorAll(".nav-group.open").forEach(el=>el.classList.remove("open"))});
    $("#mobileNav").addEventListener("click",event=>{if(event.target.closest("a"))$("#mobileNav").classList.remove("open")});
    window.addEventListener("hashchange",()=>{route();bindForms()});
    renderNavigation();
    if(!location.hash)location.hash="#/";
    route();
    bindForms();
  </script>
</body>
</html>
